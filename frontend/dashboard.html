<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>TOSO Dashboard — Good Food. Smart Control.</title>
    <meta name="description" content="TOSO restaurant admin dashboard — manage orders, menu, and analytics.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --deep-purple: #28134F;
            --vibrant-purple: #6737C7;
            --lavender: #A98BE8;
            --hot-pink: #F34B9B;
            --coral: #FF665F;
            --bright-orange: #FFAA22;
            --lime: #C9F227;
            --sky-blue: #48B9E8;
            --off-white: #FFFDF8;
            --dark-text: #171329;
            --white: #FFFFFF;
            --soft-shadow: 0 8px 32px rgba(23, 19, 41, 0.08);
            --card-shadow: 0 4px 20px rgba(23, 19, 41, 0.06);
            --font-heading: 'Fredoka', 'Baloo 2', sans-serif;
            --font-body: 'Nunito', 'DM Sans', sans-serif;
            --transition-smooth: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --radius-sm: 12px;
            --radius-md: 20px;
            --radius-lg: 24px;
            --sidebar-width: 260px;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-body);
            background: #f5f3fa;
            color: var(--dark-text);
            line-height: 1.5;
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        h1, h2, h3, h4 {
            font-family: var(--font-heading);
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        button {
            cursor: pointer;
            font-family: var(--font-body);
            border: none;
            transition: all var(--transition-smooth);
        }

        img {
            max-width: 100%;
            display: block;
        }

        /* ──────────── SIDEBAR ──────────── */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: var(--sidebar-width);
            height: 100vh;
            background: var(--deep-purple);
            color: #fff;
            z-index: 100;
            display: flex;
            flex-direction: column;
            padding: 24px 0;
            transition: transform 0.35s ease;
            overflow-y: scroll;
        }
        .sidebar::-webkit-scrollbar{
            display: none;
        }
        .sidebar-logo {
            padding: 0 24px 30px;
            font-size: 2rem;
            font-family: var(--font-heading);
            font-weight: 700;
            letter-spacing: 0.04em;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .sidebar-logo .dot {
            width: 10px;
            height: 10px;
            background: var(--lime);
            border-radius: 50%;
            margin-left: 2px;
            animation: pulse 2s infinite;
            display: inline-block;
            position: relative;
            top: -6px;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.4); }
        }
        .sidebar-nav {
            list-style: none;
            padding: 0 12px;
            flex: 1;
        }
        .sidebar-nav li {
            margin-bottom: 4px;
        }
        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 16px;
            border-radius: 50px;
            color: rgba(255,255,255,0.8);
            font-weight: 600;
            transition: all var(--transition-smooth);
            font-size: 0.95rem;
        }
        .sidebar-nav a:hover,
        .sidebar-nav a.active {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }
        .sidebar-nav a i {
            width: 20px;
            text-align: center;
            font-size: 1.1rem;
        }
        .sidebar-footer {
            padding: 20px 24px 0;
            border-top: 1px solid rgba(255,255,255,0.15);
            margin-top: 16px;
        }
        .sidebar-footer a {
            display: flex;
            align-items: center;
            gap: 10px;
            color: rgba(255,255,255,0.7);
            font-size: 0.9rem;
            padding: 10px 0;
            transition: color var(--transition-smooth);
        }
        .sidebar-footer a:hover {
            color: #fff;
        }

        /* ──────────── MAIN CONTENT ──────────── */
        .main {
            margin-left: var(--sidebar-width);
            flex: 1;
            padding: 24px;
            transition: margin-left 0.35s ease;
            width: calc(100% - var(--sidebar-width));
        }
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 32px;
            flex-wrap: wrap;
            gap: 16px;
        }
        .top-bar h1 {
            font-size: 1.8rem;
            color: var(--deep-purple);
        }
        .top-bar-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .btn-hamburger {
            display: none;
            background: var(--vibrant-purple);
            color: #fff;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            font-size: 1.2rem;
            border: none;
            align-items: center;
            justify-content: center;
        }

        .section-title {
            font-size: 1.6rem;
            color: var(--deep-purple);
            margin-bottom: 24px;
        }
        .card {
            background: #fff;
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: var(--card-shadow);
            margin-bottom: 24px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }
        .stat-card {
            background: #fff;
            padding: 24px;
            border-radius: var(--radius-md);
            box-shadow: var(--card-shadow);
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .stat-icon {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            flex-shrink: 0;
        }
        .stat-icon.pink { background: #fdf2f8; color: var(--hot-pink); }
        .stat-icon.lime { background: #f8ffe6; color: #6b8c1a; }
        .stat-icon.blue { background: #eff6ff; color: var(--sky-blue); }
        .stat-icon.orange { background: #fff7e6; color: var(--bright-orange); }
        .stat-value {
            font-family: var(--font-heading);
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--deep-purple);
        }
        .stat-label {
            font-size: 0.85rem;
            color: #888;
            font-weight: 600;
        }

        /* ──────────── TABLE ENHANCEMENTS ──────────── */
        table {
            width: 100%;
            border-collapse: collapse;
            border-spacing: 0;
        }
        th, td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid #f0edf5;
            font-size: 0.9rem;
            vertical-align: middle;
        }
        th {
            color: #888;
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            background: #faf9fc;
            position: sticky;
            top: 0;
        }
        tbody tr {
            transition: background 0.2s ease;
        }
        tbody tr:hover {
            background: #fcfaff;
        }
        tbody tr:nth-child(even) {
            background: #fdfcff;
        }
        tbody tr:nth-child(even):hover {
            background: #f8f5ff;
        }

        .status-badge {
            padding: 6px 14px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.75rem;
            display: inline-block;
            font-family: var(--font-heading);
            text-transform: capitalize;
        }
        .status-b{
             font-family: var(--font-heading);
        }
        .status-pending { background: #fff3e0; color: #c77700; }
        .status-confirmed { background: #e8f5e9; color: #2e7d32; }
        .status-preparing { background: #e3f2fd; color: #1565c0; }
        .status-ready { background: #fff8e1; color: #f57f17; }
        .status-out_for_delivery { background: #f3e5f5; color: #6a1b9a; }
        .status-completed { background: #e8f5e9; color: #2e7d32; }
        .status-cancelled { background: #ffeaea; color: #c62828; }

        .btn {
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all var(--transition-smooth);
            border: none;
        }
        .btn-primary {
            background: var(--vibrant-purple);
            color: #fff;
        }
        .btn-primary:hover {
            background: #5729b3;
            transform: translateY(-1px);
        }
        .btn-lime {
            background: var(--lime);
            color: var(--deep-purple);
        }
        .btn-lime:hover {
            background: #ddf030;
            box-shadow: 0 6px 18px rgba(201,242,39,0.4);
        }
        .btn-outline {
            border: 2px solid #e0dce8;
            color: #555;
        }
        .btn-outline:hover {
            border-color: var(--vibrant-purple);
            color: var(--vibrant-purple);
        }
        .btn-sm {
            padding: 6px 12px;
            font-size: 0.8rem;
        }
        .btn-xs {
            padding: 4px 10px;
            font-size: 0.7rem;
            border-radius: 50px;
            white-space: nowrap;
        }
        .btn-danger {
            background: #f8f0ff;
            color: var(--coral);
            border: 1px solid #ffd6d6;
        }
        .btn-danger-2 {
            background: #58008b;
            color: white;
            /* border: 1px solid #4e004a; */
        }
        .btn-danger:hover {
            background: #ffe8e8;
        }
        .status-action-btn {
            background: #f5f3fa;
            color: var(--dark-text);
            border: 1px solid #e0dce8;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .status-action-btn:hover:not(:disabled) {
            background: var(--vibrant-purple);
            color: #fff;
            border-color: var(--vibrant-purple);
        }
        .status-action-btn:disabled {
            opacity: 0.6;
            background: #e8e5f0;
            cursor: not-allowed;
            border-color: transparent;
        }

/* Availability toggle switch */
.form-group input[type="checkbox"] {
    -webkit-appearance: none;
    appearance: none;
    width: 46px;
    height: 26px;
    background: #ddd;
    border-radius: 13px;
    position: relative;
    outline: none;
    cursor: pointer;
    transition: background 0.3s ease;
    flex-shrink: 0;
    margin: 0;
}

.form-group input[type="checkbox"]::after {
    content: "";
    position: absolute;
    top: 1.5px;
    left: 1px;
    width: 20px;
    height: 20px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    transition: transform 0.3s ease;
}

.form-group input[type="checkbox"]:checked {
    background: var(--vibrant-purple);
}

.form-group input[type="checkbox"]:checked::after {
    transform: translateX(20px);
}

.form-group label {
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
}

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: nowrap;        /* Force single line */
            align-items: center;
            overflow-x: auto;
            padding-bottom: 4px;
        }
        .address-cell {
            min-width: 200px;
    max-width: 320px;
            word-break: break-word;
            white-space: normal;
        }
        .notes-cell {
            min-width: 200px;
    max-width: 320px;
            word-break: break-word;
            white-space: normal;
        }

.inquiries-action{
    display: flex;
    gap: 10px;
}

        /* Map button */
        .map-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #f0edf5;
            color: var(--vibrant-purple);
            transition: all 0.2s;
        }
        .map-link:hover {
            background: var(--vibrant-purple);
            color: #fff;
            transform: scale(1.1);
        }

        /* ──────────── CHARTS GRID ──────────── */
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
            margin-top: 8px;
        }
        .chart-card {
            background: #fff;
            border-radius: var(--radius-lg);
            padding: 20px;
            box-shadow: var(--card-shadow);
        }
        .chart-card h3 {
            margin-bottom: 12px;
            color: var(--deep-purple);
        }
        .chart-container {
            position: relative;
            width: 100%;
            height: 300px;
        }
        @media (max-width: 900px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }
        }

        /* ──────────── MODAL ──────────── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 20px;
        }
        .modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }
        .modal {
            background: #fff;
            border-radius: var(--radius-lg);
            padding: 32px;
            max-width: 520px;
            width: 100%;
            max-height: 85vh;
            overflow-y: scroll;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            animation: popIn 0.3s ease;
        }
        .modal::-webkit-scrollbar{
            display: none;
        }
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }
        .modal h2 {
            font-size: 1.5rem;
            color: var(--deep-purple);
            margin-bottom: 20px;
        }
        .modal .form-group {
            margin-bottom: 16px;
        }
        .modal label {
            display: block;
            font-weight: 600;
            margin-bottom: 4px;
            color: #555;
            font-size: 0.9rem;
        }
        .modal input, .modal select, .modal textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e8e5f0;
            border-radius: var(--radius-sm);
            font-family: var(--font-body);
            transition: border var(--transition-smooth);
        }
        .modal input:focus, .modal select:focus, .modal textarea:focus {
            border-color: var(--vibrant-purple);
            outline: none;
        }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }
        .close-modal {
            background: transparent;
            border: none;
            font-size: 1.2rem;
            position: absolute;
            top: 16px;
            right: 16px;
            color: #999;
            cursor: pointer;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #aaa;
        }
        .empty-state i {
            font-size: 2.5rem;
            margin-bottom: 12px;
        }


      .customer-cancelled-order {

}

#dashboardNotifications {
    position: fixed;
    top: 24px;
    right: 24px;
    z-index: 99999;

    display: flex;
    flex-direction: column;
    gap: 12px;

    width: min(380px, calc(100vw - 32px));

    pointer-events: none;
}

.dashboard-notification {
    display: flex;
    align-items: flex-start;
    gap: 12px;

    padding: 14px 16px;

    background: rgba(255, 255, 255, 0.96);
    border: 1px solid rgba(103, 55, 199, 0.15);
    border-radius: 14px;

    box-shadow:
        0 12px 30px rgba(0, 0, 0, 0.12);

    backdrop-filter: blur(12px);

    transform: translateX(120%);
    opacity: 0;

    animation:
        dashboardNotificationIn 0.35s ease forwards;
}

.dashboard-notification-icon {
    width: 38px;
    height: 38px;

    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 10px;

    background: #6737C7;
    color: white;

    font-size: 16px;
}

.dashboard-notification-content {
    flex: 1;
    min-width: 0;
}

.dashboard-notification-title {
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 3px;
    color: #222;
}

.dashboard-notification-message {
    font-size: 13px;
    color: #666;
    line-height: 1.4;
}

.dashboard-notification-close {
    border: none;
    background: transparent;
    cursor: pointer;

    color: #999;
    font-size: 16px;

    padding: 2px;
}

.dashboard-notification-close:hover {
    color: #222;
}

.dashboard-notification.hide {
    animation:
        dashboardNotificationOut 0.3s ease forwards;
}

@keyframes dashboardNotificationIn {
    from {
        transform: translateX(120%);
        opacity: 0;
    }

    to {
        transform: translateX(0);
        opacity: 1;
    }
}

@keyframes dashboardNotificationOut {
    from {
        transform: translateX(0);
        opacity: 1;
    }

    to {
        transform: translateX(120%);
        opacity: 0;
    }
}

@media (max-width: 600px) {
    #dashboardNotifications {
        top: 14px;
        right: 14px;
        left: 14px;
        width: auto;
    }
}
        /* ──────────── RESPONSIVE ──────────── */
        @media (max-width: 900px) {
            .sidebar {
                transform: translateX(-100%);
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .main {
                margin-left: 0;
                width: 100%;
            }
            .btn-hamburger {
                display: flex;
            }
            .top-bar h1 {
                font-size: 1.3rem;
            }
            table {
                font-size: 0.8rem;
            }
            th, td {
                padding: 10px 8px;
            }
        }
        @media (max-width: 600px) {
            .main {
                padding: 16px;
            }
            .stats-grid {
                grid-template-columns: 1fr;
            }
            .modal {
                padding: 20px;
            }
            .chart-container {
                height: 240px;
            }
        }
    </style>

    <script>
        (function() {
            const API_BASE = 'http://localhost:5000/api';

            async function protectAdminDashboard() {

    const token =
        sessionStorage.getItem(
            "tosoAdminToken"
        );

    if (!token) {

        window.location.replace(
            "adminlogin.html"
        );

        return;
    }

    try {

        const response =
            await fetch(
                `${API_BASE}/admin/me`,
                {
                    headers: {
                        Authorization:
                            `Bearer ${token}`
                    }
                }
            );

        const result =
            await response.json();

        if (
            !response.ok ||
            !result.success
        ) {

            sessionStorage.removeItem(
                "tosoAdminToken"
            );

            sessionStorage.removeItem(
                "tosoAdmin"
            );

            window.location.replace(
                "adminlogin.html"
            );

            return;
        }

        console.log(
            "✅ Admin authenticated:",
            result.data.username
        );

    } catch (error) {

        console.error(
            "❌ Admin authentication failed:",
            error
        );

        sessionStorage.removeItem(
            "tosoAdminToken"
        );

        sessionStorage.removeItem(
            "tosoAdmin"
        );

        window.location.replace(
            "adminlogin.html"
        );
    }
}

protectAdminDashboard();

            const SOCKET_BASE =

function showDashboardNotification(message, title = "TOSO Dashboard") {

    const container =
        document.getElementById("dashboardNotifications");

    if (!container) {
        console.warn(
            "Dashboard notification container not found."
        );
        return;
    }

    const notification =
        document.createElement("div");

    notification.className =
        "dashboard-notification";

    notification.innerHTML = `
        <div class="dashboard-notification-icon">
            <i class="fa-solid fa-bell"></i>
        </div>

        <div class="dashboard-notification-content">
            <div class="dashboard-notification-title">
                ${title}
            </div>

            <div class="dashboard-notification-message">
                ${message}
            </div>
        </div>

        <button
            class="dashboard-notification-close"
            type="button"
            aria-label="Close notification"
        >
            <i class="fa-solid fa-xmark"></i>
        </button>
    `;

    container.appendChild(notification);

    const closeButton =
        notification.querySelector(
            ".dashboard-notification-close"
        );

    const removeNotification = () => {

        if (notification.classList.contains("hide")) {
            return;
        }

        notification.classList.add("hide");

        setTimeout(() => {
            notification.remove();
        }, 300);
    };

    closeButton.addEventListener(
        "click",
        removeNotification
    );

    setTimeout(
        removeNotification,
        5000
    );
}

window.assignRiderToOrder = async function(orderId) {
    const selected = document.querySelector('input[name="riderAssign"]:checked');
    if (!selected) {
        alert('Please select a rider.');
        return;
    }
    const riderId = selected.value;

    const submitButton = document.getElementById('assignRiderBtn');
    if (submitButton) {
        submitButton.disabled = true;
        submitButton.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Assigning...`;
    }

    try {
        const response = await fetch(`${API_BASE}/orders/${encodeURIComponent(orderId)}/assign-rider`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ riderId })
        });
        const data = await response.json();
        if (!response.ok || !data.success) throw new Error(data.message || 'Failed to assign rider.');

        await loadOrders();
        closeModal();
        navigateTo(currentPage);
    } catch (error) {
        console.error('❌ Error assigning rider:', error);
        alert(error.message);
        if (submitButton) {
            submitButton.disabled = false;
            submitButton.innerHTML = 'Assign';
        }
    }
};

function normalizeOrder(order) {
    return {
        id: order.orderNumber,

        customer: order.customer?.name || 'Unknown',

        phone: order.customer?.phone || '',

        email: order.customer?.email || '',

        orderType:
            order.orderType === 'dine_in'
                ? 'Dine In'
                : order.orderType === 'takeaway'
                    ? 'Takeaway'
                    : order.orderType === 'delivery'
                        ? 'Delivery'
                        : order.orderType || 'N/A',

        deliveryAddress:
            order.address?.text || '',

        latitude:
            order.address?.latitude ?? null,

        longitude:
            order.address?.longitude ?? null,

        items:
    Array.isArray(order.items)
        ? order.items.map(item => ({
            name: item.name,
            quantity: item.quantity
        }))
        : [],

        total:
            order.pricing?.total || 0,

        status:
            order.status || 'pending',
           
        state:
            order.state ?? null,

        date:
            order.createdAt
                ? new Date(order.createdAt)
                    .toISOString()
                    .split('T')[0]
                : 'N/A',

         notes: order.notes || '',

        createdAt: order.createdAt,

        updatedAt: order.updatedAt,

        raw: order,
        riderId: order.riderId || order.rider?._id || null,
    };
}

function getLocalDateString(date) {
    const d = new Date(date);
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
}

function isOrderCancelled(o) {
    return o.status === 'cancelled' || o.state === 'cancelled';
}


           function renderAnalytics(container) {
    container.innerHTML = `
        <div class="charts-grid">
            <div class="chart-card"><h3>Revenue Trend</h3><div class="chart-container"><canvas id="revenueChart"></canvas></div></div>
            <div class="chart-card"><h3>Order Status Breakdown</h3><div class="chart-container"><canvas id="statusChart"></canvas></div></div>
            <div class="chart-card"><h3>Popular Items</h3><div class="chart-container"><canvas id="itemsChart"></canvas></div></div>
            <div class="chart-card"><h3>Order Types</h3><div class="chart-container"><canvas id="orderTypeChart"></canvas></div></div>
        </div>
    `;

    const orders = getOrders();

    // ========================================
    // 1. EXCLUDE CANCELLED ORDERS (both state & status)
    // ========================================
    const activeOrders = orders.filter(o => !isOrderCancelled(o));

   // ========================================
// 2. REVENUE TREND (completed orders only, local date, last 7 days)
// ========================================
const completedOrders = orders.filter(o => o.status === 'completed');

const last7Days = [];
for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    last7Days.push(getLocalDateString(d));
}

const revenueByDate = {};
last7Days.forEach(date => revenueByDate[date] = 0);

completedOrders.forEach(o => {
    const localDate = o.createdAt ? getLocalDateString(o.createdAt) : null;
    if (localDate && revenueByDate.hasOwnProperty(localDate)) {
        revenueByDate[localDate] += o.total;
    }
});

    const revenueCtx = document.getElementById('revenueChart').getContext('2d');
    chartInstances.revenue = new Chart(revenueCtx, {
        type: 'line',
        data: {
            labels: last7Days,
            datasets: [{
                label: 'Revenue (PKR)',
                data: last7Days.map(d => revenueByDate[d]),
                borderColor: '#6737C7',
                backgroundColor: 'rgba(103,55,199,0.1)',
                tension: 0.3,
                fill: true,
                pointBackgroundColor: '#F34B9B',
            }]
        },
        options: { responsive: true, maintainAspectRatio: false }
    });

    // ========================================
    // 3. ORDER STATUS BREAKDOWN (exclude cancelled)
    // ========================================
       // ========================================
    // 3. ORDER STATUS BREAKDOWN (INCLUDING CANCELLED)
    // ========================================
    const statusCounts = {};

    // Use ALL orders (not activeOrders) to include cancelled
    orders.forEach(o => {
        // Combine both state and status cancellations into "cancelled"
        let key = o.status || 'pending';
        if (o.state === 'cancelled' || o.status === 'cancelled') {
            key = 'cancelled';
        }
        statusCounts[key] = (statusCounts[key] || 0) + 1;
    });

    // Maintain a consistent order and color mapping
    const statusOrder = ['pending', 'confirmed', 'preparing', 'ready', 'out_for_delivery', 'completed', 'cancelled'];
    const statusColors = {
        pending: '#FFAA22',
        confirmed: '#C9F227',
        preparing: '#48B9E8',
        ready: '#F34B9B',
        out_for_delivery: '#A98BE8',
        completed: '#2e7d32',
        cancelled: '#FF665F' // coral red
    };

    const labels = statusOrder.filter(s => statusCounts[s] > 0);
    const values = labels.map(s => statusCounts[s]);
    const colors = labels.map(s => statusColors[s] || '#888');

    const statusCtx = document.getElementById('statusChart').getContext('2d');
    chartInstances.status = new Chart(statusCtx, {
        type: 'doughnut',
        data: {
            labels: labels,
            datasets: [{
                data: values,
                backgroundColor: colors
            }]
        },
        options: { responsive: true, maintainAspectRatio: false }
    });

    // ========================================
    // 4. POPULAR ITEMS (exclude cancelled)
    // ========================================
    const itemCounts = {};
    activeOrders.forEach(o => {
        if (Array.isArray(o.items)) {
            o.items.forEach(item => {
                const name = typeof item === 'string' ? item : item.name;
                itemCounts[name] = (itemCounts[name] || 0) + 1;
            });
        }
    });
    const sortedItems = Object.entries(itemCounts).sort((a,b) => b[1]-a[1]).slice(0,6);
    const itemsCtx = document.getElementById('itemsChart').getContext('2d');
    chartInstances.items = new Chart(itemsCtx, {
        type: 'bar',
        data: {
            labels: sortedItems.map(i => i[0]),
            datasets: [{
                label: 'Orders',
                data: sortedItems.map(i => i[1]),
                backgroundColor: '#A98BE8',
                borderRadius: 8,
            }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
    });

    // ========================================
    // 5. ORDER TYPES (exclude cancelled)
    // ========================================
    const typeCounts = {};
    activeOrders.forEach(o => {
        if (o.orderType) typeCounts[o.orderType] = (typeCounts[o.orderType] || 0) + 1;
    });
    const typeCtx = document.getElementById('orderTypeChart').getContext('2d');
    chartInstances.type = new Chart(typeCtx, {
        type: 'pie',
        data: {
            labels: Object.keys(typeCounts),
            datasets: [{
                data: Object.values(typeCounts),
                backgroundColor: ['#F34B9B', '#48B9E8', '#6737C7', '#FFAA22']
            }]
        },
        options: { responsive: true, maintainAspectRatio: false }
    });
}

window.deleteChefsSpecial = async function(id) {

    const items = getChefsSpecial();

    const item = items.find(
        i => String(i.id) === String(id)
    );

    if (!item) {

        alert("Chef's Special item not found.");

        return;
    }


    const confirmed = confirm(
        `Are you sure you want to delete "${item.name}"?`
    );

    if (!confirmed) {
        return;
    }


    try {

        const response = await fetch(

            `${API_BASE}/chefs-special/${encodeURIComponent(id)}`,

            {
                method: "DELETE"
            }
        );


        const data =
            await response.json();


        if (!response.ok || !data.success) {

            throw new Error(
                data.message ||
                "Failed to delete Chef's Special."
            );
        }


        console.log(
            "✅ Chef's Special deleted:",
            item.name
        );


        // ========================================
        // RELOAD FROM MONGODB
        // ========================================

        await loadChefsSpecial();


        // ========================================
        // REFRESH PAGE
        // ========================================

        navigateTo("chefs-special");


    } catch (error) {

        console.error(
            "❌ Error deleting Chef's Special:",
            error
        );

            "Failed to delete Chef's Special."
        );
    }
};

                // RELOAD FROM MONGODB
                // ========================================

                await loadMenu();


                // ========================================
                // CLOSE MODAL
                // ========================================

                closeModal();


                // ========================================
                // REFRESH MENU PAGE
                // ========================================

                navigateTo("menu");


            } catch (error) {

                console.error(
                    "❌ Error updating menu item:",
                    error
                );


                alert(
                    error.message ||
                    "Failed to update menu item."
                );


                submitButton.disabled = false;

                submitButton.innerHTML =
                    "Save Changes";

            }

        });

};

window.deleteMenuItem = async function(id) {

    if (!confirm("Are you sure you want to delete this menu item?")) {
        return;
    }

    try {

        const response = await fetch(
            `${API_BASE}/menu/${encodeURIComponent(id)}`,
            {
                method: "DELETE"
            }
        );

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(
                data.message ||
                "Failed to delete menu item."
            );
        }

        console.log(
            "✅ Menu item deleted:",
            data
        );

        // Reload menu from MongoDB
        await loadMenu();

        // Refresh menu page
        navigateTo("menu");

    } catch (error) {

        console.error(
            "❌ Error deleting menu item:",
            error
        );

        alert(
            error.message ||
            "Failed to delete menu item."
        );
    }
};

window.viewInquiry = function(inquiryId) {

    const inquiry = getInquiries().find(
        item => String(item._id) === String(inquiryId)
    );

    if (!inquiry) {
        alert("Inquiry not found.");
        return;
    }

    const createdDate = inquiry.createdAt
        ? new Date(inquiry.createdAt).toLocaleString()
        : "N/A";

    const modal =
        document.getElementById("modalContent");

    modal.innerHTML = `

        <button
            class="close-modal"
            onclick="closeModal()"
        >
            <i class="fa-solid fa-xmark"></i>
        </button>

        <h2>Customer Inquiry</h2>

        <p>
            <strong>Name:</strong>
            ${inquiry.name || "N/A"}
        </p>

        <p>
            <strong>Phone:</strong>
            ${inquiry.phone || "N/A"}
        </p>

        <p>
            <strong>Email:</strong>
            ${inquiry.email || "N/A"}
        </p>

        <p>
            <strong>Subject:</strong>
            ${inquiry.subject || "N/A"}
        </p>

        <p>
            <strong>Date:</strong>
            ${createdDate}
        </p>

        <p>
            <strong>Message:</strong>
        </p>

        <p style="
            background:#f8f6fc;
            padding:14px;
            border-radius:12px;
            margin-top:8px;
            white-space:pre-wrap;
        ">
            ${inquiry.message || "N/A"}

        <div class="modal-actions">

            <button
                class="btn btn-outline"

            >

    `;

    document
        .getElementById("modalOverlay")
        .classList.add("open");
};


            window.deleteInquiry = async function(inquiryId) {

    if (!confirm("Delete this inquiry?")) {
        return;
    }

    try {

        const response = await fetch(
            `${API_BASE}/inquiries/${encodeURIComponent(inquiryId)}`,
            {
                method: "DELETE"
            }
        );

        const result = await response.json();

        if (!response.ok || !result.success) {
            throw new Error(
                result.message ||
                "Failed to delete inquiry."
            );
        }

        console.log(
            "✅ Inquiry deleted:",
            result
        );

        // Reload MongoDB data
        await loadInquiries();

        // Refresh dashboard
        navigateTo("inquiries");

    } catch (error) {

        console.error(
            "❌ Error deleting inquiry:",
            error
        );

        alert(
            error.message ||
            "Failed to delete inquiry."
        );
    }
};

            window.closeModal = function() {
                document.getElementById('modalOverlay').classList.remove('open');
            };
            document.getElementById('modalOverlay').addEventListener('click', function(e) {
                if (e.target === this) closeModal();
            });

            

            document.querySelectorAll('.sidebar-nav a').forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    const page = this.dataset.page;
                    navigateTo(page);
                });
            });

            document.getElementById('hamburgerBtn').addEventListener('click', function() {
                document.getElementById('sidebar').classList.toggle('open');
            });

            document.addEventListener('click', function(e) {
                const sidebar = document.getElementById('sidebar');
                const hamburger = document.getElementById('hamburgerBtn');
                if (window.innerWidth <= 900 && !sidebar.contains(e.target) && e.target !== hamburger && !hamburger.contains(e.target)) {
                    sidebar.classList.remove('open');
                }
            });
